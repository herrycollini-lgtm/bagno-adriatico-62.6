<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestionale — Bagno Adriatico 62</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="admin-body"><div class="admin-shell wide"><header class="admin-head"><div><span class="eyebrow-label">GESTIONALE</span><h1>Prenotazioni ristorante</h1></div><div><a class="btn btn-ghost" href="/">Sito</a> <button class="btn btn-ocean" onclick="logout()">Esci</button></div></header>
<section class="admin-grid"><div class="admin-card"><h2>Impostazioni</h2><label>Massimo persone al giorno<input id="maxPeople" type="number" min="1"></label><label class="checkrow"><input id="reserve" type="checkbox"> Usa tavoli di riserva nelle disponibilità online</label><button class="btn btn-ocean" onclick="saveSettings()">Salva impostazioni</button><span id="settingMsg"></span></div><div class="admin-card"><h2>Giornata</h2><label>Data<input id="date" type="date" onchange="loadBookings()"></label><div class="stat-big" id="dailyTotal">0</div><div class="muted">persone prenotate</div></div></section>
<section class="admin-card"><div class="section-bar"><h2>Prenotazioni</h2><button class="btn btn-ghost" onclick="loadBookings()">Aggiorna</button></div><div id="bookings"></div></section></div>
<script>
const $=id=>document.getElementById(id);
async function init(){const now=new Date();$('date').value=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);const s=await (await fetch('/api/admin/settings')).json();$('maxPeople').value=s.max_people;$('reserve').checked=s.reserve_enabled;loadBookings();}
async function loadBookings(){const rows=await (await fetch('/api/admin/bookings?date='+$('date').value)).json();let total=0;rows.forEach(x=>{if(x.status==='confirmed')total+=x.people});$('dailyTotal').textContent=total;const box=$('bookings');if(!rows.length){box.innerHTML='<p class="muted">Nessuna prenotazione per questa data.</p>';return}box.innerHTML=rows.map(x=>`<article class="admin-booking ${x.status==='cancelled'?'cancelled':''}"><div><b>${x.time} · ${esc(x.name)}</b><p>${x.people} persone · Zona ${esc(x.zone)} · ${esc(x.tables.join(' + '))}</p><p>${esc(x.phone)}${x.notes?' · '+esc(x.notes):''}</p></div><div>${x.status==='confirmed'?`<button class="btn btn-danger" onclick="cancelBooking(${x.id})">Cancella</button>`:'<span class="status-cancelled">Cancellata</span>'}</div></article>`).join('')}
async function cancelBooking(id){if(!confirm('Cancellare questa prenotazione?'))return;await fetch('/api/admin/bookings/'+id,{method:'DELETE'});loadBookings();}
async function saveSettings(){const r=await fetch('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({max_people:$('maxPeople').value,reserve_enabled:$('reserve').checked})});$('settingMsg').textContent=r.ok?' Salvato.':' Errore.';}
async function logout(){await fetch('/api/logout',{method:'POST'});location='/'}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
init();
</script></body></html>
