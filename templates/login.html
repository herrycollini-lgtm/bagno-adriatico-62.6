<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Area amministratore — Bagno Adriatico 62</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="admin-body"><div class="admin-shell"><div class="admin-card"><span class="eyebrow-label">AREA RISERVATA</span><h1>Accesso amministratore</h1><p>Gestisci le prenotazioni del ristorante.</p><label>Nome utente<input id="user" autocomplete="username"></label><label>Password<input id="pass" type="password" autocomplete="current-password"></label><button class="btn btn-ocean" onclick="login()">Accedi</button><div id="msg" class="admin-msg"></div><a class="admin-back" href="/">← Torna al sito</a></div></div>
<script>async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user.value,password:pass.value})});if(r.ok){location='/admin'}else{msg.textContent=(await r.json()).error}}</script></body></html>
